# Cloudflare Worker + static assets for tools.xm1221.cn/arch-template.
# The bundle in dist-worker/ is produced by `npm run build:worker`.
# It already shims node:fs so generateZip can read embedded templates.
name = "arch-template"
main = "dist-worker/index.js"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/arch-template/api/*"]

# Optional. Set this in the dashboard or uncomment after `wrangler login`
# if this account owns the xm1221.cn zone. Do not commit account-specific ids.
# routes = [{ pattern = "tools.xm1221.cn/arch-template*", zone_name = "xm1221.cn" }]

[vars]
# Same-origin hosting does not need this. Set it when GitHub Pages calls this Worker.
# One origin, a comma-separated allowlist, or "*". No account id belongs here.
# CORS_ORIGIN = "https://<user>.github.io"
